name: ahni-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ahni_dev
      POSTGRES_USER: ahni_dev
      POSTGRES_PASSWORD: ${AHNI_DEV_DB_PASSWORD:?Set AHNI_DEV_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ahni_dev", "-d", "ahni_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data: