spring.datasource.url=${AHNI_DEV_DB_URL}
spring.datasource.username=${AHNI_DEV_DB_USERNAME}
spring.datasource.password=${AHNI_DEV_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

ahni.cors.allowed-origins=${AHNI_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
